---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.APP_NAME }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.APP_NAME }}
    restartedAt: "{{ now | unixEpoch }}"
  {{- if .Values.backend.service.annotations }}
  annotations:
  {{- toYaml .Values.backend.service.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.backend.service.type | quote }}
  selector:
    app: {{ .Values.APP_NAME }}
  ports:
  - name: web
    port: 8080
    targetPort: web
    {{- with .Values.backend.service.nodePort }}
    nodePort: {{ . }}
    {{- end }}
