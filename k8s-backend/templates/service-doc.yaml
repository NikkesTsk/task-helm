{{- $env := default "" .Values.ENV_NAME }}
{{- if (and .Values.HOST (ne $env "prod")) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.APP_NAME }}-doc
  labels:
    app.kubernetes.io/name: {{ .Values.APP_NAME }}-doc
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Values.APP_NAME }}-doc
  ports:
    - name: web
      port: 8080
      targetPort: web
{{- end }}
