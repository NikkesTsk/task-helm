---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .Values.APP_NAME }}-secret
spec:
  vaultAuthRef: {{ .Values.VAULT_AUTH_REF | default "default" | quote }}
  mount: {{ required "VAULT_MOUNT must be provided" .Values.VAULT_MOUNT | quote }}
  type: kv-v2
  path: {{ required "SECRET_LOCATION must be provided" .Values.SECRET_LOCATION | quote }}
  destination:
    create: true
    name: {{ .Values.APP_NAME }}-secret

---
{{- if .Values.INTERNAL }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.APP_NAME }}-basic-auth
type: Opaque
stringData:
  auth: |
    {{- required "BASIC_AUTH must be supplied when INTERNAL is enabled" .Values.BASIC_AUTH | nindent 4 -}}
{{- end }}
