{{- if .Values.HOST}}
{{- $hosts := .Values.HOSTS | default (splitList "," .Values.HOST) }}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.APP_NAME }}
  labels: { app: {{ .Values.APP_NAME }} }
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/compute-full-forwarded-for: "true"
    {{- if .Values.CORS }}
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET,OPTIONS,PUT,PATCH,DELETE,POST"
    nginx.ingress.kubernetes.io/cors-allow-headers: "*"
    nginx.ingress.kubernetes.io/cors-max-age: "100"
    nginx.ingress.kubernetes.io/cors-allow-origin-list-regex: {{ .Values.CORS | quote }}
    nginx.ingress.kubernetes.io/add-vary-header: "true"
    {{- end }}
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
#    {{- if .Values.INTERNAL }}
#    # Basic Auth (см. секцию Secret ниже)
#    nginx.ingress.kubernetes.io/auth-type: basic
#    nginx.ingress.kubernetes.io/auth-secret: {{ .Values.APP_NAME }}-basic-auth
#    nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required'
#    {{- end }}

spec:
  ingressClassName: nginx
  rules:
    {{- range $hosts }}
    - host: {{ . | trim }}
      http:
        paths:
          - path: "/{{ default "api" $.Values.URL_PREFIX }}(?!(/next|/doc))(?:/|$)"
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $.Values.APP_NAME }}
                port:
                  number: 8080
#                  name: web
    {{- end }}
    {{- if .Values.EXTRA_FRONTEND }}
    - host: {{ .Values.EXTRA_FRONTEND }}
      http:
        paths:
          - path: "/{{ default "api" .Values.URL_PREFIX }}(?!(/next|/doc))(?:/|$)"
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.APP_NAME }}
                port:
                  number: 8080
#                  name: web
    {{- end }}
  tls:
    - secretName: {{ .Values.APP_NAME }}-ssl
      hosts:
        {{- range $hosts }}
        - {{ . | trim }}
        {{- end }}
    {{- if .Values.EXTRA_FRONTEND }}
    - secretName: {{ .Values.APP_NAME }}-extra-ssl
      hosts:
        - {{ .Values.EXTRA_FRONTEND }}
    {{- end }}

{{- end }}
