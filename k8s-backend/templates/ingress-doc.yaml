{{- $env := default "" .Values.ENV_NAME }}
{{- if (and .Values.HOST (ne $env "prod")) }}
{{- $hosts := .Values.HOSTS | default (splitList "," .Values.HOST) }}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.APP_NAME }}-doc
  labels: { app: {{ .Values.APP_NAME }} }
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: "/$1"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    {{- if .Values.INTERNAL }}
    # Basic Auth (см. секцию Secret ниже)
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ .Values.APP_NAME }}-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required'
    {{- end }}

spec:
  ingressClassName: nginx
  rules:
    {{- range $hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: "/api/doc(?:/|$)(.*)"
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $.Values.APP_NAME }}-doc
                port:
#                  name: web
                  number: 8080
    {{- end }}
  {{- if .Values.EXTRA_FRONTEND }}
    - host: {{ .Values.EXTRA_FRONTEND }}
      http:
        paths:
          - path: "/api/doc(?:/|$)(.*)"
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.APP_NAME }}-doc
                port:
#                  name: web
                  number: 8080
  {{- end }}
  tls:
    - secretName: {{ .Values.APP_NAME }}-ssl
      hosts:
        {{- range $hosts }}
        - {{ . | trim }}
        {{- end }}
    {{- if .Values.EXTRA_FRONTEND }}
    - secretName: {{ .Values.APP_NAME }}-extra-ssl
      hosts:
        - {{ .Values.EXTRA_FRONTEND }}
    {{- end }}

{{- end }}
